<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#090e1c">
<title>Mini Invaders — Control de rebote</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#090e1c;color:#edf4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;touch-action:manipulation;user-select:none}
#game{width:min(100vw,480px);height:100vh;height:100dvh;max-height:900px;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse at 50% 30%,#182745 0%,#0c1426 55%,#080d18 100%);overflow:hidden}
header{height:72px;flex:none;padding:16px 22px 8px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.label{font-size:10px;letter-spacing:2px;color:#8192b4;font-weight:800}
.value{font-size:23px;font-weight:850;font-variant-numeric:tabular-nums}
#playfield{position:relative;flex:1;min-height:0;touch-action:manipulation}
canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;pointer-events:none;background:linear-gradient(180deg,rgba(7,12,24,.12),rgba(7,12,24,.35))}
#overlay.hidden{display:none}
h1{font-size:clamp(32px,9vw,46px);line-height:.98;letter-spacing:-1.8px;margin:0;font-weight:950}
#description{color:#a8b8d5;font-size:14px;line-height:1.5;max-width:290px;margin:16px 0 0}
footer{flex:none;padding:12px 22px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:9px;background:linear-gradient(0deg,rgba(5,9,17,.75),transparent)}
button{border:0;border-radius:16px;padding:15px 28px;background:#b8f36b;color:#101827;font-weight:900;font-size:15px;letter-spacing:.7px;width:100%;max-width:320px;box-shadow:0 6px 24px #b8f36b22}
button:active{transform:scale(.985)}
#fireHint{color:#8192b4;font-size:12px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div id="game">
<header>
  <div><div class="label">PUNTOS</div><div class="value" id="score">0</div></div>
  <div style="text-align:center"><div class="label">OLEADA</div><div class="value" id="wave">1</div></div>
  <div style="text-align:right"><div class="label">RÉCORD</div><div class="value" id="best">0</div></div>
</header>
<main id="playfield">
  <canvas id="canvas"></canvas>
  <div id="overlay">
    <h1 id="title">MINI<br>INVADERS</h1>
    <p id="description">Espera a que la esfera entre en la zona verde y toca para disparar.<br>¡Cada acierto invierte su dirección!</p>
  </div>
</main>
<footer>
  <button id="start">JUGAR</button>
  <div id="fireHint">TOCA SOLO CUANDO LA ESFERA ESTÉ EN LA ZONA VERDE</div>
</footer>
</div>
<script>
(() => {
  const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
  const field=document.getElementById('playfield');
  const scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),bestEl=document.getElementById('best');
  const overlay=document.getElementById('overlay'),titleEl=document.getElementById('title'),descEl=document.getElementById('description'),startBtn=document.getElementById('start');

  const W=420,H=700,LANE_Y=H-120,LANE_LEFT=42,LANE_RIGHT=378,BALL_R=9,ZONE_HALF=34;
  let dpr=1,running=false,last=0,score=0,wave=1,best=0;
  let enemies=[],bullets=[],particles=[],stars=[];
  let formationOffset=0,formationDir=1,formationSpeed=15,descentSpeed=3;
  let ballX=LANE_LEFT,ballDir=1,ballSpeed=54,zoneX=260,zoneDir=-1,zoneSpeed=10,shipX=LANE_LEFT;
  let pauseUntil=0,feedback='',feedbackUntil=0;

  try{best=Number(localStorage.getItem('miniInvadersBest')||0)||0}catch(e){}
  bestEl.textContent=best;

  function resize(){
    const r=field.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));
    ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);draw();
  }
  addEventListener('resize',resize);
  function makeStars(){stars=Array.from({length:65},(_,i)=>({x:(i*73+29)%W,y:(i*137+41)%H,r:(i%3)*.45+.5,a:.15+(i%5)*.08}));}
  function makeWave(){
    enemies=[];const cols=Math.min(7+Math.floor((wave-1)/2),9),rows=Math.min(3+Math.floor((wave-1)/3),5);
    const gapX=43,gapY=44,startX=(W-(cols-1)*gapX)/2;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({x:startX+c*gapX,y:72+r*gapY,row:r,alive:true,bob:Math.random()*6.28,radius:13});
    formationOffset=0;formationDir=1;formationSpeed=15+Math.min((wave-1)*1.25,12);descentSpeed=3+Math.min((wave-1)*.25,2);
  }
  function startGame(){
    score=0;wave=1;bullets=[];particles=[];ballX=LANE_LEFT;ballDir=1;ballSpeed=54;zoneX=260;zoneDir=-1;zoneSpeed=10;shipX=LANE_LEFT;pauseUntil=0;feedback='';feedbackUntil=0;
    scoreEl.textContent='0';waveEl.textContent='1';makeWave();running=true;last=performance.now();
    overlay.classList.add('hidden');startBtn.style.display='none';requestAnimationFrame(loop);
  }
  function endGame(){
    running=false;overlay.classList.remove('hidden');titleEl.innerHTML='FIN DE<br>PARTIDA';
    descEl.innerHTML=`Puntuación: <b>${score}</b><br>Oleada alcanzada: ${wave}`;
    startBtn.textContent='REINTENTAR';startBtn.style.display='block';draw();
  }
  function reflect(pos,dir,spd,dt,min,max){
    let n=pos+dir*spd*dt;
    while(n>max||n<min){if(n>max){n=max-(n-max);dir=-1}if(n<min){n=min+(min-n);dir=1}}
    return [n,dir];
  }
  function fire(){
    bullets.push({x:shipX,y:H-105,speed:450,r:4});
    for(let i=0;i<4;i++)particles.push({x:shipX+(Math.random()-.5)*10,y:H-108,vx:(Math.random()-.5)*30,vy:-35,life:.2,max:.2,r:2});
    feedback='¡DISPARO!';feedbackUntil=performance.now()+350;
  }
  function burst(x,y){for(let i=0;i<7;i++){let a=6.283*i/7;particles.push({x,y,vx:Math.cos(a)*(25+Math.random()*40),vy:Math.sin(a)*(25+Math.random()*40),life:.38,max:.38,r:2+Math.random()*2})}}
  function update(dt,now){
    for(const s of stars){s.y+=5*dt;if(s.y>H)s.y=0}
    if(now>=pauseUntil){
      [ballX,ballDir]=reflect(ballX,ballDir,ballSpeed,dt,LANE_LEFT,LANE_RIGHT);
      [zoneX,zoneDir]=reflect(zoneX,zoneDir,zoneSpeed,dt,LANE_LEFT+ZONE_HALF,LANE_RIGHT-ZONE_HALF);
    }
    // The ship tracks the bouncing marker; a successful timing hit determines shot position.
    shipX=ballX;
    const living=enemies.filter(e=>e.alive);
    if(living.length){
      const min=Math.min(...living.map(e=>e.x+formationOffset)),max=Math.max(...living.map(e=>e.x+formationOffset));
      if((formationDir>0&&max>W-28)||(formationDir<0&&min<28)){formationDir*=-1;for(const e of living)e.y+=12}
      formationOffset+=formationDir*formationSpeed*dt;
      for(const e of living){e.y+=descentSpeed*dt;e.bob+=dt*2}
      if(living.some(e=>e.y>H-220)){endGame();return}
    }else{wave++;waveEl.textContent=wave;makeWave()}
    for(const b of bullets)b.y-=b.speed*dt;
    bullets=bullets.filter(b=>b.y>-20);
    for(const b of bullets){
      if(b.dead)continue;
      for(const e of enemies){
        if(!e.alive)continue;
        const dx=b.x-(e.x+formationOffset),dy=b.y-(e.y+Math.sin(e.bob)*2);
        if(dx*dx+dy*dy<(e.radius+5)**2){e.alive=false;b.dead=true;score+=10;scoreEl.textContent=score;burst(e.x+formationOffset,e.y);
          if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('miniInvadersBest',String(best))}catch(err){}}
          break;
        }
      }
    }
    bullets=bullets.filter(b=>!b.dead);
    for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
    particles=particles.filter(p=>p.life>0);
  }
  function drawEnemy(e){
    const x=e.x+formationOffset,y=e.y+Math.sin(e.bob)*2,color=e.row%3===0?'#ff9b83':e.row%3===1?'#b8a5ff':'#78d9df';
    ctx.save();ctx.translate(x,y);ctx.fillStyle=color;
    ctx.fillRect(-10,-8,20,14);ctx.fillRect(-14,-3,28,8);ctx.fillRect(-17,2,5,6);ctx.fillRect(12,2,5,6);ctx.fillRect(-10,8,5,5);ctx.fillRect(5,8,5,5);
    ctx.fillStyle='#101827';ctx.fillRect(-7,-3,4,4);ctx.fillRect(3,-3,4,4);ctx.restore();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#dce9ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;
    for(const e of enemies)if(e.alive)drawEnemy(e);
    // Proyectiles: nacen justo encima de la nave.
    for(const b of bullets){ctx.shadowBlur=12;ctx.shadowColor='#b8f36b';ctx.beginPath();ctx.moveTo(b.x,b.y-8);ctx.lineTo(b.x,b.y+8);ctx.strokeStyle='#b8f36b';ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();ctx.shadowBlur=0}

    // Timing lane from the previous game
    ctx.beginPath();ctx.moveTo(LANE_LEFT,LANE_Y);ctx.lineTo(LANE_RIGHT,LANE_Y);ctx.strokeStyle='rgba(151,174,211,.24)';ctx.lineWidth=7;ctx.lineCap='round';ctx.stroke();
    ctx.beginPath();ctx.moveTo(zoneX-ZONE_HALF,LANE_Y);ctx.lineTo(zoneX+ZONE_HALF,LANE_Y);ctx.strokeStyle='rgba(184,243,107,.25)';ctx.lineWidth=24;ctx.stroke();
    ctx.beginPath();ctx.moveTo(zoneX-ZONE_HALF,LANE_Y);ctx.lineTo(zoneX+ZONE_HALF,LANE_Y);ctx.strokeStyle='#b8f36b';ctx.lineWidth=4;ctx.stroke();
    const ballGrad=ctx.createRadialGradient(ballX-3,LANE_Y-4,1,ballX,LANE_Y,BALL_R+1);
    ballGrad.addColorStop(0,'#fff');ballGrad.addColorStop(.4,'#e4ffbd');ballGrad.addColorStop(1,'#8ad14b');
    ctx.beginPath();ctx.arc(ballX,LANE_Y,BALL_R,0,6.283);ctx.fillStyle=ballGrad;ctx.shadowBlur=13;ctx.shadowColor='#b8f36b';ctx.fill();ctx.shadowBlur=0;
    // Nave del jugador: sprite grande y contrastado, siguiendo la posición de la esfera.
    ctx.save();ctx.translate(shipX,H-68);
    ctx.shadowBlur=18;ctx.shadowColor='#49d9ff';
    ctx.fillStyle='#236b91';ctx.strokeStyle='#9cecff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(22,15);ctx.lineTo(11,11);ctx.lineTo(7,22);ctx.lineTo(-7,22);ctx.lineTo(-11,11);ctx.lineTo(-22,15);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;ctx.fillStyle='#b8f3ff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(7,7);ctx.lineTo(-7,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffbd68';ctx.fillRect(-12,18,6,8);ctx.fillRect(6,18,6,8);
    ctx.fillStyle='#d8faff';ctx.fillRect(-3,9,6,8);
    ctx.restore();
    for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#d9ffad';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;
    if(feedback&&performance.now()<feedbackUntil){ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#d9ffad';ctx.fillText(feedback,W/2,LANE_Y+34)}
  }
  function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;update(dt,now);draw();if(running)requestAnimationFrame(loop)}
  function tap(e){
    if(!running)return;e.preventDefault();
    if(performance.now()<pauseUntil)return;
    // Exact same timing rule: the moving ball's CENTER must be inside the moving green zone.
    if(Math.abs(ballX-zoneX)>ZONE_HALF){endGame();return}
    shipX=ballX;
    fire();
    // Successful timing reverses the bouncing ball and briefly pauses it.
    ballDir*=-1;pauseUntil=performance.now()+180;
    ballSpeed=Math.min(125,ballSpeed+.9);zoneSpeed=Math.min(24,zoneSpeed+.14);
    draw();
  }
  field.addEventListener('pointerdown',tap,{passive:false});
  startBtn.addEventListener('click',startGame);
  makeStars();makeWave();resize();draw();
})();
</script>
</body>
</html>
